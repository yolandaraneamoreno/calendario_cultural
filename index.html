<style id="cal-css">
/* Layout: barra de herramientas pegajosa + rejilla de calendario a la izquierda, filtros por pueblo como leyenda de colores */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --fg:#1d2420; --muted:#5f6b65; --line:#dfe3df; --line-strong:#c6ccc7;
  --accent:#24543f; --accent-ink:#ffffff; --today:#24543f; --weekend:#eef0ed; --hover:#eaeee9;
  --shadow:0 10px 30px rgba(20,35,28,.16);
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --c-villalba:#1f9a52; --c-sanlorenzo:#e0459a; --c-escorial:#a24bc4; --c-torrelodones:#e57a1e;
  --c-guadarrama:#138f9c; --c-galapagar:#d43c3c; --c-alpedrete:#b8961a; --c-moralzarzal:#8a6243;
  --c-colladomediano:#5560d8; --c-cercedilla:#6d9124; --c-navacerrada:#3f8fd9; --c-losmolinos:#8b3a6b;
  --c-becerril:#5a7180; --c-hoyo:#e0705a; --c-lasrozas:#2457e6; --c-otro:#7a827d;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131815; --surface:#1b211e; --fg:#e7ece8; --muted:#9aa69f; --line:#2b332e; --line-strong:#3a443e;
  --accent:#7fc7a0; --accent-ink:#0e1a14; --today:#7fc7a0; --weekend:#171d1a; --hover:#232b26;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  --c-villalba:#43c178; --c-sanlorenzo:#f070b4; --c-escorial:#c27ee0; --c-torrelodones:#f29a4c;
  --c-guadarrama:#3fbdc9; --c-galapagar:#ee6b6b; --c-alpedrete:#dcbc42; --c-moralzarzal:#b98c68;
  --c-colladomediano:#8a92f0; --c-cercedilla:#9bc054; --c-navacerrada:#6fb1ee; --c-losmolinos:#c46b9f;
  --c-becerril:#8fa5b3; --c-hoyo:#f09886; --c-lasrozas:#6b92ff; --c-otro:#a3aba6;
}}
:root[data-theme="dark"]{
  --bg:#131815; --surface:#1b211e; --fg:#e7ece8; --muted:#9aa69f; --line:#2b332e; --line-strong:#3a443e;
  --accent:#7fc7a0; --accent-ink:#0e1a14; --today:#7fc7a0; --weekend:#171d1a; --hover:#232b26;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  --c-villalba:#43c178; --c-sanlorenzo:#f070b4; --c-escorial:#c27ee0; --c-torrelodones:#f29a4c;
  --c-guadarrama:#3fbdc9; --c-galapagar:#ee6b6b; --c-alpedrete:#dcbc42; --c-moralzarzal:#b98c68;
  --c-colladomediano:#8a92f0; --c-cercedilla:#9bc054; --c-navacerrada:#6fb1ee; --c-losmolinos:#c46b9f;
  --c-becerril:#8fa5b3; --c-hoyo:#f09886; --c-lasrozas:#6b92ff; --c-otro:#a3aba6;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700}
.btn:hover{background:var(--hover)}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;display:grid;place-items:center}
.icon-btn:hover{background:var(--hover)}
.period{font-family:var(--f-display);font-weight:600;font-size:19px;min-width:12ch}
.seg button{min-width:0}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.refresh{display:flex;align-items:center;gap:10px}
.btn-primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:8px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn-primary[disabled]{opacity:.6;cursor:default}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.status{color:var(--muted);font-size:12px;max-width:34ch}

.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
aside{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.towns{display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){.towns{flex-direction:row;flex-wrap:wrap;gap:6px}}

.town:hover{background:var(--hover)}

.town[aria-pressed="false"] .sw{background:transparent}

.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.link{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}

.sources a{color:inherit}
.search{width:100%;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 10px;font:inherit}

main{min-width:0}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.dow div{padding:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 4px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.we{background:var(--weekend)}
.day.out .num{opacity:.4}
.num{align-self:center;font-family:var(--f-mono);font-size:12px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin-bottom:2px;font-variant-numeric:tabular-nums}
button.num{border:0;background:transparent;color:inherit;font:inherit;font-family:var(--f-mono);font-size:12px;cursor:pointer}
button.num:hover{background:var(--hover)}
.day.today button.num:hover{background:var(--today)}
.wday{border:0;background:transparent;color:inherit;font:inherit;padding:0;display:flex;gap:6px;align-items:baseline;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
.wday:hover b{text-decoration:underline}
.ag-date{border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ag-date:hover b{text-decoration:underline}
.dayview{display:flex;flex-direction:column}
.dv-sec{padding:6px 8px 10px}
.dv-sec h3{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 6px 4px}
.dv-sec+.dv-sec{border-top:1px solid var(--line)}
.dv-count{color:var(--muted);font-size:13px;padding:12px 14px 0}
.day.today .num{background:var(--today);color:var(--accent-ink);font-weight:500}
.ev{display:flex;align-items:center;gap:5px;border:0;background:transparent;border-radius:5px;padding:2px 5px;font-size:12px;line-height:1.3;text-align:left;min-width:0;width:100%}
.ev:hover{background:var(--hover)}
.ev .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.ev .t{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none}
.ev .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev.span{background:color-mix(in srgb,var(--c) 18%,transparent)}
.ev.span .dot{border-radius:2px}
.more{border:0;background:none;font-size:12px;color:var(--muted);text-align:left;padding:1px 5px;font-weight:700}
.more:hover{color:var(--fg)}
@media (max-width:640px){
  .day{min-height:64px;padding:2px}
  .ev .n,.ev .t{display:none}
  .ev{width:auto;padding:2px}
  .day .evs{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
  .more{display:none}
}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
@media (max-width:760px){.week{grid-template-columns:minmax(0,1fr)}}
.wcol{border-right:1px solid var(--line);min-height:320px;display:flex;flex-direction:column;min-width:0}
.wcol:last-child{border-right:0}
@media (max-width:760px){.wcol{border-right:0;border-bottom:1px solid var(--line);min-height:0}}
.wcol h3{margin:0;padding:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:baseline}
.wcol h3 b{font-family:var(--f-display);font-size:20px;color:var(--fg);letter-spacing:0}
.wcol.today h3 b{color:var(--accent)}
.wlist{padding:6px;display:flex;flex-direction:column;gap:6px}
.card{border:0;text-align:left;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-left:4px solid var(--c);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.card:hover{background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.card .t{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card .n{font-weight:700;font-size:13px;overflow-wrap:anywhere}
.card .w{font-size:12px;color:var(--muted)}
.empty-day{color:var(--muted);font-size:12px;padding:6px}

.agenda{display:flex;flex-direction:column}
.ag-day{display:grid;grid-template-columns:110px minmax(0,1fr);border-bottom:1px solid var(--line)}
@media (max-width:560px){.ag-day{grid-template-columns:minmax(0,1fr)}}
.ag-date{padding:12px 14px;display:flex;flex-direction:column}
.ag-date b{font-family:var(--f-display);font-size:26px;line-height:1}
.ag-date span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.ag-items{display:flex;flex-direction:column;padding:6px 8px}
.ag-item{display:grid;grid-template-columns:84px 12px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:8px 6px;border-radius:8px}
.ag-item:hover{background:var(--hover)}
.ag-item .t{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ag-item .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.ag-item .n{font-weight:700;min-width:0}
.ag-item .w{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ag-item .p{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
@media (max-width:560px){.ag-item{grid-template-columns:12px minmax(0,1fr)}.ag-item .t,.ag-item .p{grid-column:2}}
.blank{padding:40px 20px;text-align:center;color:var(--muted)}
.blank b{display:block;color:var(--fg);font-family:var(--f-display);font-size:18px;margin-bottom:6px}

.pop-back{position:fixed;inset:0;background:rgba(10,15,12,.35);z-index:40;display:grid;place-items:center;padding:16px}
.pop-back[hidden]{display:none}
.pop{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(460px,100%);max-height:85vh;overflow:auto;border-top:6px solid var(--c)}
.pop-h{display:flex;gap:10px;align-items:flex-start;padding:16px 16px 4px}
.pop-h h3{font-family:var(--f-display);font-size:20px;line-height:1.2;margin:0;text-wrap:balance;flex:1}
.pop-b{padding:4px 16px 18px;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:80px minmax(0,1fr);gap:8px;font-size:14px}
.row dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.row dd{margin:0;overflow-wrap:anywhere}

.pop a{color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
</style>

<script id="cal-core">
const TOWNS=[
 ["Collado Villalba","villalba"],["San Lorenzo de El Escorial","sanlorenzo"],["El Escorial","escorial"],
 ["Torrelodones","torrelodones"],["Guadarrama","guadarrama"],["Galapagar","galapagar"],["Alpedrete","alpedrete"],
 ["Moralzarzal","moralzarzal"],["Collado Mediano","colladomediano"],["Cercedilla","cercedilla"],["Navacerrada","navacerrada"],
 ["Los Molinos","losmolinos"],["Becerril de la Sierra","becerril"],["Hoyo de Manzanares","hoyo"],["Las Rozas","lasrozas"]
];
const CATS={cultura:"Cultura",taller:"Talleres y cursos",fiesta:"Fiestas y ferias"};
const MONTHS=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DOWS=["lun","mar","mié","jue","vie","sáb","dom"];
const townKey=n=>{const t=TOWNS.find(x=>x[0].toLowerCase()===String(n||"").toLowerCase());return t?t[1]:"otro"};
const colorOf=n=>`var(--c-${townKey(n)})`;

let events=[], meta={}, config={};
let view="month", cursor=startOfDay(new Date());
let offTowns=new Set(), cats=new Set(Object.keys(CATS)), query="";
try{const s=JSON.parse(localStorage.getItem("agenda-sierra-prefs")||"{}");if(s.view)view=s.view;if(s.off)offTowns=new Set(s.off);if(s.cats&&s.cats.length)cats=new Set(s.cats)}catch(e){}
function savePrefs(){try{localStorage.setItem("agenda-sierra-prefs",JSON.stringify({view,off:[...offTowns],cats:[...cats]}))}catch(e){}}

function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function mondayOf(d){const x=startOfDay(d);const k=(x.getDay()+6)%7;return addDays(x,-k)}
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};

function visible(){
  const q=query.trim().toLowerCase();
  return events.filter(e=>!offTowns.has(townKey(e.town))&&cats.has(e.category||"cultura")&&
    (!q||[e.title,e.venue,e.town,e.description].join(" ").toLowerCase().includes(q)));
}
function onDay(list,dayIso){
  return list.filter(e=>e.date===dayIso||(e.end&&e.date<dayIso&&e.end>=dayIso))
    .sort((a,b)=>(a.end&&a.end!==a.date?0:1)-(b.end&&b.end!==b.date?0:1)||(a.time||"99").localeCompare(b.time||"99"));
}

function renderTowns(){
  const box=document.getElementById("towns");box.textContent="";
  const counts={};events.forEach(e=>{const k=townKey(e.town);counts[k]=(counts[k]||0)+1});
  TOWNS.forEach(([name,k])=>{
    const b=el("button","town");b.type="button";b.style.setProperty("--c",`var(--c-${k})`);
    b.setAttribute("aria-pressed",String(!offTowns.has(k)));
    b.append(el("span","sw"),el("span","nm",name),el("span","ct",String(counts[k]||0)));
    b.onclick=()=>{offTowns.has(k)?offTowns.delete(k):offTowns.add(k);savePrefs();renderAll()};
    box.append(b);
  });
}
function renderCats(){
  const box=document.getElementById("cats");box.textContent="";
  Object.entries(CATS).forEach(([k,l])=>{
    const b=el("button","chip",l);b.type="button";b.setAttribute("aria-pressed",String(cats.has(k)));
    b.onclick=()=>{cats.has(k)?cats.delete(k):cats.add(k);savePrefs();renderAll()};box.append(b);
  });
}
function evButton(e,dayIso){
  const b=el("button","ev");b.type="button";b.style.setProperty("--c",colorOf(e.town));
  const multi=e.end&&e.end!==e.date;if(multi)b.classList.add("span");
  b.append(el("span","dot"));
  if(e.time&&!multi&&e.date===dayIso)b.append(el("span","t",e.time));
  b.append(el("span","n",e.title));b.title=e.title+" · "+e.town;b.onclick=()=>openPop(e);return b;
}
function renderMonth(box){
  const first=new Date(cursor.getFullYear(),cursor.getMonth(),1);
  const start=mondayOf(first);const todayIso=iso(new Date());const list=visible();
  const dow=el("div","dow");DOWS.forEach(d=>dow.append(el("div","",d)));box.append(dow);
  const grid=el("div","grid");
  const last=new Date(cursor.getFullYear(),cursor.getMonth()+1,0);const weeks=Math.ceil(((first.getDay()+6)%7+last.getDate())/7);
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i),di=iso(d);const c=el("div","day");
    if(d.getMonth()!==cursor.getMonth())c.classList.add("out");if(i%7>=5)c.classList.add("we");if(di===todayIso)c.classList.add("today");
    const nb=el("button","num",String(d.getDate()));nb.type="button";nb.setAttribute("aria-label","Ver el "+d.getDate()+" de "+MONTHS[d.getMonth()]);nb.onclick=()=>openDay(d);c.append(nb);
    const evs=el("div","evs");evs.style.cssText="display:flex;flex-direction:column;gap:2px;min-width:0";
    const items=onDay(list,di);const max=4;
    items.slice(0,max).forEach(e=>evs.append(evButton(e,di)));
    if(items.length>max){const m=el("button","more","+"+(items.length-max)+" más");m.type="button";m.onclick=()=>openDay(d);evs.append(m)}
    c.append(evs);grid.append(c);
  }
  box.append(grid);
  const ml=MONTHS[cursor.getMonth()];return ml.charAt(0).toUpperCase()+ml.slice(1)+" "+cursor.getFullYear();
}
function card(e){
  const b=el("button","card");b.type="button";b.style.setProperty("--c",colorOf(e.town));
  b.append(el("span","t",(e.time||"Todo el día")+(e.price?" · "+e.price:"")),el("span","n",e.title),el("span","w",e.town+(e.venue?" · "+e.venue:"")));
  b.onclick=()=>openPop(e);return b;
}
function renderWeek(box){
  const start=mondayOf(cursor);const todayIso=iso(new Date());const list=visible();const w=el("div","week");
  for(let i=0;i<7;i++){
    const d=addDays(start,i),di=iso(d);const col=el("div","wcol");if(di===todayIso)col.classList.add("today");
    const h=el("h3");const hb=el("button","wday");hb.type="button";hb.setAttribute("aria-label","Ver el "+d.getDate()+" de "+MONTHS[d.getMonth()]);hb.append(DOWS[i]+" ",el("b","",String(d.getDate())));hb.onclick=()=>openDay(d);h.append(hb);col.append(h);
    const l=el("div","wlist");const items=onDay(list,di);
    if(!items.length)l.append(el("div","empty-day","Sin eventos"));items.forEach(e=>l.append(card(e)));
    col.append(l);w.append(col);
  }
  box.append(w);const end=addDays(start,6);
  return start.getDate()+(start.getMonth()!==end.getMonth()?" "+MONTHS[start.getMonth()].slice(0,3):"")+" – "+end.getDate()+" "+MONTHS[end.getMonth()].slice(0,3)+" "+end.getFullYear();
}
function agItem(e){
  const b=el("button","ag-item");b.type="button";b.style.setProperty("--c",colorOf(e.town));
  const n=el("span","n",e.title);n.append(el("span","w",e.town+(e.venue?" · "+e.venue:"")+(e.end&&e.end!==e.date?" · hasta el "+parse(e.end).getDate()+" "+MONTHS[parse(e.end).getMonth()].slice(0,3):"")));
  b.append(el("span","t",e.time||"Todo el día"),el("span","dot"),n,el("span","p",e.price||""));b.onclick=()=>openPop(e);return b;
}
const DOWS_LONG=["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
function renderDay(box){
  const di=iso(cursor);const items=onDay(visible(),di);
  const multi=e=>e.end&&e.end!==e.date;
  const timed=items.filter(e=>!multi(e)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
  const long=items.filter(multi);
  const v=el("div","dayview");
  if(!items.length){const b=el("div","blank");b.append(el("b","","No hay eventos este día"),document.createTextNode("Prueba con otro día usando las flechas, o activa más pueblos o tipos."));v.append(b)}
  else{
    v.append(el("div","dv-count",timed.length+(timed.length===1?" evento":" eventos")+(long.length?" · "+long.length+(long.length===1?" exposición o actividad de varios días":" exposiciones y actividades de varios días"):"")));
    if(timed.length){const s=el("div","dv-sec");s.append(el("h3","","Programación del día"));const it=el("div","ag-items");timed.forEach(e=>it.append(agItem(e)));s.append(it);v.append(s)}
    if(long.length){const s=el("div","dv-sec");s.append(el("h3","","Exposiciones y actividades de varios días"));const it=el("div","ag-items");long.forEach(e=>it.append(agItem(e)));s.append(it);v.append(s)}
  }
  box.append(v);
  const t=DOWS_LONG[(cursor.getDay()+6)%7]+" "+cursor.getDate()+" de "+MONTHS[cursor.getMonth()]+" de "+cursor.getFullYear();
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function openDay(d){cursor=startOfDay(d);setView("day")}
function renderList(box){
  const list=visible();const from=iso(startOfDay(new Date()));const ag=el("div","agenda");
  const days=new Map();
  list.forEach(e=>{const key=e.end&&e.date<from&&e.end>=from?from:e.date;if((e.end||e.date)<from)return;(days.get(key)||days.set(key,[]).get(key)).push(e)});
  const keys=[...days.keys()].sort();
  if(!keys.length){const b=el("div","blank");b.append(el("b","","No hay eventos con estos filtros"),document.createTextNode("Activa más pueblos o tipos, o pulsa Actualizar para buscar novedades."));ag.append(b)}
  keys.forEach(k=>{
    const d=parse(k);const row=el("div","ag-day");const dt=el("button","ag-date");dt.type="button";dt.setAttribute("aria-label","Ver el "+d.getDate()+" de "+MONTHS[d.getMonth()]);dt.onclick=()=>openDay(d);
    dt.append(el("b","",String(d.getDate())),el("span","",DOWS[(d.getDay()+6)%7]+" · "+MONTHS[d.getMonth()].slice(0,3)));
    const it=el("div","ag-items");
    days.get(k).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")).forEach(e=>it.append(agItem(e)));
    row.append(dt,it);ag.append(row);
  });
  box.append(ag);return "Próximos eventos";
}
function renderAll(){
  renderTowns();renderCats();
  const box=document.getElementById("cal");box.textContent="";
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===view)));
  const label=view==="day"?renderDay(box):view==="month"?renderMonth(box):view==="week"?renderWeek(box):renderList(box);
  document.getElementById("period").textContent=label;
  ["b-prev","b-next","b-today"].forEach(id=>document.getElementById(id).hidden=view==="list");
}
function setView(v){view=v;savePrefs();renderAll()}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  const v=b.dataset.view,t=startOfDay(new Date());
  if(v==="day"&&(view==="list"||(view==="month"&&t.getMonth()===cursor.getMonth()&&t.getFullYear()===cursor.getFullYear())))cursor=t;
  setView(v);
});
document.getElementById("b-prev").onclick=()=>{cursor=view==="month"?new Date(cursor.getFullYear(),cursor.getMonth()-1,1):addDays(cursor,view==="day"?-1:-7);renderAll()};
document.getElementById("b-next").onclick=()=>{cursor=view==="month"?new Date(cursor.getFullYear(),cursor.getMonth()+1,1):addDays(cursor,view==="day"?1:7);renderAll()};
document.getElementById("b-today").onclick=()=>{cursor=startOfDay(new Date());renderAll()};
document.getElementById("t-all").onclick=()=>{offTowns.clear();savePrefs();renderAll()};
document.getElementById("t-none").onclick=()=>{TOWNS.forEach(t=>offTowns.add(t[1]));savePrefs();renderAll()};
document.getElementById("q").oninput=e=>{query=e.target.value;renderAll()};

function fmtDate(e){
  const a=parse(e.date);let s=DOWS[(a.getDay()+6)%7]+" "+a.getDate()+" de "+MONTHS[a.getMonth()];
  if(e.end&&e.end!==e.date){const b=parse(e.end);s="Del "+a.getDate()+" de "+MONTHS[a.getMonth()]+" al "+b.getDate()+" de "+MONTHS[b.getMonth()]}
  return s;
}
const pop=document.getElementById("pop");
function openPop(e){
  pop.textContent="";const p=el("div","pop");p.style.setProperty("--c",colorOf(e.town));p.setAttribute("role","dialog");p.setAttribute("aria-modal","true");
  const h=el("div","pop-h");h.append(el("h3","",e.title));const x=el("button","icon-btn","×");x.type="button";x.setAttribute("aria-label","Cerrar");x.onclick=closePop;h.append(x);
  const b=el("div","pop-b");const dl=el("dl");dl.style.cssText="display:flex;flex-direction:column;gap:8px;margin:0";
  const add=(k,v)=>{if(!v)return;const r=el("div","row");r.append(el("dt","",k));const dd=el("dd");if(v instanceof Node)dd.append(v);else dd.textContent=v;r.append(dd);dl.append(r)};
  const tg=el("span","tag");tg.append(el("i"),document.createTextNode(e.town));add("Pueblo",tg);
  add("Fecha",fmtDate(e));add("Hora",e.time||"Consultar horario");add("Precio",e.price||"Consultar");add("Lugar",e.venue);add("Tipo",CATS[e.category]||"");
  b.append(dl);if(e.description)b.append(el("p","",e.description));
  if(e.url){const a=el("a","","Ver en "+(e.source||"la fuente")+" ↗");a.href=e.url;a.target="_blank";a.rel="noopener";b.append(a)}
  b.append(el("p","note","Los horarios y precios pueden cambiar: confírmalos en la web del organizador."));
  p.append(h,b);pop.append(p);pop.hidden=false;x.focus();
}
function closePop(){pop.hidden=true;pop.textContent=""}
pop.onclick=e=>{if(e.target===pop)closePop()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!pop.hidden)closePop()});

if(window.__STATIC){events=window.__STATIC.events||[];renderAll()}
</script>
<script id="cal-live">
/* ---- Estado de actualización ---- */
const statusEl=document.getElementById("status"),rBtn=document.getElementById("b-refresh"),rIcon=document.getElementById("r-icon"),rLabel=document.getElementById("r-label");
function ago(ts){if(!ts)return"";const m=Math.round((Date.now()-ts)/60000);if(m<1)return"hace un momento";if(m<60)return"hace "+m+" min";const h=Math.round(m/60);if(h<48)return"hace "+h+" h";return"hace "+Math.round(h/24)+" días"}
function renderStatus(){
  const running=meta.state==="running"&&meta.requestedAt&&Date.now()-meta.requestedAt<45*60000;
  rBtn.disabled=running||!config.triggerId;
  rIcon.className=running?"spin":"";rIcon.textContent=running?"":"⟳";rLabel.textContent=running?"Buscando…":"Actualizar";
  if(running)statusEl.textContent="Revisando webs de ayuntamientos y prensa local. Los eventos aparecerán solos (unos 10-20 min).";
  else if(meta.state==="error")statusEl.textContent="La última actualización falló"+(meta.message?": "+meta.message:"")+". Prueba de nuevo.";
  else statusEl.textContent=events.length+" eventos"+(meta.updatedAt?" · actualizado "+ago(meta.updatedAt):"");
}
setInterval(renderStatus,60000);

/* ---- Descargar una copia fija en HTML (sin botón de actualizar) ---- */
const expBtn=document.getElementById("b-export");
function buildSnapshot(){
  const when=new Date(meta.updatedAt||Date.now());
  const fecha=when.getDate()+" de "+MONTHS[when.getMonth()]+" de "+when.getFullYear();
  const top=document.querySelector(".top").cloneNode(true);
  top.querySelector(".refresh").replaceWith(el("div","status","Agenda actualizada el "+fecha+" · "+events.length+" eventos"));
  const wrap=document.querySelector(".wrap").cloneNode(true);
  ["#cal","#towns","#cats"].forEach(s=>{const n=wrap.querySelector(s);if(n)n.textContent=""});
  const data=JSON.stringify({events:events.map(({id,...e})=>e),updatedAt:when.getTime()}).replace(/</g,"\\u003c");
  const core=document.getElementById("cal-core").textContent;
  const css=document.getElementById("cal-css").textContent;
  const fonts=[...document.querySelectorAll('link[href*="fonts.googleapis"]')].map(l=>l.outerHTML).join("");
  const iso8=when.getFullYear()+String(when.getMonth()+1).padStart(2,"0")+String(when.getDate()).padStart(2,"0");
  const html="<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">"
    +"<title>Agenda de la Sierra · "+fecha+"</title>"+fonts
    +"<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}"+css+"</style></head><body>"
    +top.outerHTML+wrap.outerHTML+"<div class=\"pop-back\" id=\"pop\" hidden></div>"
    +"<script>window.__STATIC="+data+";<\/script><script>"+core+"<\/script></body></html>";
  return {html,filename:"agenda-sierra-"+iso8+".html"};
}
expBtn.onclick=async()=>{
  if(!events.length){statusEl.textContent="Todavía no hay eventos cargados para descargar.";return}
  const dl=await claude.use("downloads");
  if(!dl){statusEl.textContent="La descarga no está disponible en esta vista.";return}
  expBtn.disabled=true;
  try{
    const {html,filename}=buildSnapshot();
    await dl.save({filename,data:html});
    statusEl.textContent="Descargado: "+filename+". Ese archivo funciona sin Claude y no se actualiza.";
  }catch(e){
    const c=e&&e.code;
    if(c!=="declined")statusEl.textContent="No se pudo descargar ("+(c||"error")+"). Inténtalo de nuevo.";
  }finally{expBtn.disabled=false}
};

(async()=>{
  renderAll();
  const db=await claude.use("db");
  if(!db){statusEl.textContent="No se pudo cargar la agenda en esta vista.";rBtn.disabled=true;return}
  db.collection("events").onSnapshot(s=>{events=s.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.date&&e.title);renderAll();renderStatus()},
    ()=>{statusEl.textContent="Se perdió la conexión con la agenda. Recarga la página."});
  db.doc("meta/status").onSnapshot(s=>{meta=s.exists?s.data():{};renderStatus()});
  db.doc("meta/config").onSnapshot(s=>{config=s.exists?s.data():{};renderStatus()});
  rBtn.onclick=async()=>{
    const mcp=await claude.use("mcp");
    if(!mcp||!config.triggerId){statusEl.textContent="La actualización solo está disponible para la persona que creó la agenda.";return}
    rBtn.disabled=true;rLabel.textContent="Iniciando…";
    try{
      await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:config.triggerId,text:"Actualización pedida desde la página el "+new Date().toLocaleString("es-ES")});
      meta={...meta,state:"running",requestedAt:Date.now()};
      try{await db.doc("meta/status").set(meta)}catch(e){}
      renderStatus();
    }catch(e){
      const c=e&&e.code;
      statusEl.textContent=c==="not_in_manifest"?"Has rechazado el permiso para lanzar la búsqueda. Puedes activarlo en Permisos del artefacto."
        :c==="server_not_connected"?"Conecta Claude Code Remote en Ajustes → Conectores para poder actualizar."
        :"No se pudo iniciar la búsqueda ("+(c||"error")+"). Inténtalo más tarde.";
      rBtn.disabled=false;rLabel.textContent="Actualizar";
    }
  };
})();
</script>
